version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: crop_advisory_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: crop_advisory
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./farmer\ databas.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: crop_advisory_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
